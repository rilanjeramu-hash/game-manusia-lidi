    // 3. APPLICATION STATE & MATCH SETTINGS
    // --------------------------------------------------------------------------
    const gameState = {
      screen: 'start', // 'start' | 'playing' | 'paused' | 'victory'
      playMode: 'human', // 'human' | 'bot' | 'online'
      p2Bot: false,
      botDifficulty: 'duelist', // 'chill' | 'duelist' | 'master'
      winMode: 'stocks', // 'stocks' | 'rounds'
      allowSwap: true,
      p1Loadout: 'sword',
      p2Loadout: 'shuriken',

      // 2-device online multiplayer state
      netRole: null, // null | 'host' | 'guest'
      netConnected: false,
      roomCode: '',
      remoteInput: {
        left: false,
        right: false,
        guard: false
      },

      roundNumber: 1,
<!-- ... existing code ... -->
    // --------------------------------------------------------------------------
    // 7. INPUT HANDLING (CLEAN BLUR/PAUSE SAFETY)
    // --------------------------------------------------------------------------
    const keysDown = new Set();

    // --------------------------------------------------------------------------
    // 7B. TWO-DEVICE MULTIPLAYER SYNC (PEERJS WEBRTC DATA CHANNEL)
    // --------------------------------------------------------------------------
    const netSync = {
      peer: null,
      conn: null,
      stateSyncTimer: 0,

      setStatus(text, colorClass = 'text-amber-300') {
        const el = document.getElementById('onlineStatusDot');
        if (el) {
          el.textContent = text;
          el.className = `text-[11px] font-semibold ${colorClass}`;
        }
      },

      disconnect() {
        if (this.conn) {
          try { this.conn.close(); } catch (_) {}
          this.conn = null;
        }
        if (this.peer) {
          try { this.peer.destroy(); } catch (_) {}
          this.peer = null;
        }
        gameState.netConnected = false;
        gameState.netRole = null;
        gameState.roomCode = '';
        gameState.remoteInput = { left: false, right: false, guard: false };
        const box = document.getElementById('roomCodeBox');
        if (box) {
          box.classList.add('hidden');
          box.classList.remove('flex');
        }
        this.setStatus('Belum terhubung', 'text-amber-300');
      },

      generateCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let out = '';
        for (let i = 0; i < 6; i++) {
          out += chars[Math.floor(Math.random() * chars.length)];
        }
        return out;
      },

      createHostRoom() {
        if (typeof Peer === 'undefined') {
          this.setStatus('PeerJS gagal dimuat', 'text-rose-400');
          return;
        }
        this.disconnect();
        gameState.playMode = 'online';
        gameState.p2Bot = false;
        gameState.netRole = 'host';
        const code = this.generateCode();
        gameState.roomCode = code;

        this.setStatus('Membuat ruang...', 'text-sky-300');
        const peerId = `STICKDUEL-${code}`;
        this.peer = new Peer(peerId);

        this.peer.on('open', () => {
          document.getElementById('roomCodeDisplay').textContent = code;
          const box = document.getElementById('roomCodeBox');
          box.classList.remove('hidden');
          box.classList.add('flex');
          this.setStatus('Menunggu P2...', 'text-amber-300');
          syncStartScreenUI();
        });

        this.peer.on('connection', (connection) => {
          this.bindConnection(connection);
        });

        this.peer.on('error', () => {
          this.setStatus('Gagal buat ruang', 'text-rose-400');
        });
      },

      joinRoom(rawCode) {
        if (typeof Peer === 'undefined') {
          this.setStatus('PeerJS gagal dimuat', 'text-rose-400');
          return;
        }
        const code = (rawCode || '').trim().toUpperCase();
        if (code.length < 4) {
          this.setStatus('Kode tidak valid', 'text-rose-400');
          return;
        }
        this.disconnect();
        gameState.playMode = 'online';
        gameState.p2Bot = false;
        gameState.netRole = 'guest';
        gameState.roomCode = code;

        this.setStatus('Menghubungkan...', 'text-sky-300');
        this.peer = new Peer();

        this.peer.on('open', () => {
          const connection = this.peer.connect(`STICKDUEL-${code}`, { reliable: true });
          this.bindConnection(connection);
        });

        this.peer.on('error', () => {
          this.setStatus('Ruang tidak ditemukan', 'text-rose-400');
        });
      },

      bindConnection(connection) {
        this.conn = connection;
        connection.on('open', () => {
          gameState.netConnected = true;
          this.setStatus('Terhubung!', 'text-emerald-400');
          this.send({
            type: 'hello_loadout',
            role: gameState.netRole,
            weapon: gameState.netRole === 'host' ? gameState.p1Loadout : gameState.p2Loadout,
            winMode: gameState.winMode,
            allowSwap: gameState.allowSwap
          });
          syncStartScreenUI();
        });

        connection.on('data', (msg) => {
          this.handleMessage(msg);
        });

        connection.on('close', () => {
          gameState.netConnected = false;
          this.setStatus('Terputus', 'text-rose-400');
          syncStartScreenUI();
        });

        connection.on('error', () => {
          gameState.netConnected = false;
          this.setStatus('Koneksi error', 'text-rose-400');
          syncStartScreenUI();
        });
      },

      send(payload) {
        if (this.conn && this.conn.open && gameState.netConnected) {
          try {
            this.conn.send(payload);
          } catch (_) {}
        }
      },

      handleMessage(msg) {
        if (!msg || !msg.type) return;

        if (msg.type === 'hello_loadout') {
          if (gameState.netRole === 'host' && msg.weapon && WEAPONS[msg.weapon]) {
            gameState.p2Loadout = msg.weapon;
            if (p2) p2.weapon = msg.weapon;
            syncStartScreenUI();
          } else if (gameState.netRole === 'guest') {
            if (msg.weapon && WEAPONS[msg.weapon]) {
              gameState.p1Loadout = msg.weapon;
              if (p1) p1.weapon = msg.weapon;
            }
            if (msg.winMode) gameState.winMode = msg.winMode;
            if (typeof msg.allowSwap === 'boolean') gameState.allowSwap = msg.allowSwap;
            syncStartScreenUI();
          }
          return;
        }

        if (msg.type === 'loadout_update') {
          if (msg.player === 1 && WEAPONS[msg.weapon]) {
            gameState.p1Loadout = msg.weapon;
            if (p1) p1.weapon = msg.weapon;
          } else if (msg.player === 2 && WEAPONS[msg.weapon]) {
            gameState.p2Loadout = msg.weapon;
            if (p2) p2.weapon = msg.weapon;
          }
          syncStartScreenUI();
          return;
        }

        if (msg.type === 'start_match') {
          if (msg.winMode) gameState.winMode = msg.winMode;
          if (typeof msg.allowSwap === 'boolean') gameState.allowSwap = msg.allowSwap;
          if (msg.p1Loadout && WEAPONS[msg.p1Loadout]) gameState.p1Loadout = msg.p1Loadout;
          if (msg.p2Loadout && WEAPONS[msg.p2Loadout]) gameState.p2Loadout = msg.p2Loadout;
          startNewMatch(true);
          return;
        }

        // Guest sends P2 controls to Host
        if (gameState.netRole === 'host' && msg.type === 'p2_state') {
          gameState.remoteInput.left = Boolean(msg.left);
          gameState.remoteInput.right = Boolean(msg.right);
          gameState.remoteInput.guard = Boolean(msg.guard);
          return;
        }

        if (gameState.netRole === 'host' && msg.type === 'p2_action' && p2) {
          if (msg.action === 'jump') p2.jump();
          else if (msg.action === 'drop') p2.dropPlatform();
          else if (msg.action === 'attack') {
            p2.primaryAttack(p1);
            p2.setGuard(true);
          } else if (msg.action === 'special') {
            p2.specialSkill(p1);
          } else if (msg.action === 'dash') {
            p2.dash(msg.dir || 0);
          } else if (msg.action === 'swap' && gameState.allowSwap) {
            p2.swapWeapon();
          }
          return;
        }

        // Host broadcasts authoritative fighter snapshot to Guest
        if (gameState.netRole === 'guest' && msg.type === 'world_snap' && p1 && p2) {
          this.applyWorldSnapshot(msg.snap);
        }
      },

      applyWorldSnapshot(s) {
        if (!s || !s.p1 || !s.p2) return;
        p1.x = s.p1.x; p1.y = s.p1.y; p1.vx = s.p1.vx; p1.vy = s.p1.vy;
        p1.facing = s.p1.facing; p1.hp = s.p1.hp; p1.stamina = s.p1.stamina;
        p1.mana = s.p1.mana; p1.stocks = s.p1.stocks; p1.alive = s.p1.alive;
        p1.guarding = s.p1.guarding; p1.weapon = s.p1.weapon; p1.stunTimer = s.p1.stunTimer;

        p2.x = s.p2.x; p2.y = s.p2.y; p2.vx = s.p2.vx; p2.vy = s.p2.vy;
        p2.facing = s.p2.facing; p2.hp = s.p2.hp; p2.stamina = s.p2.stamina;
        p2.mana = s.p2.mana; p2.stocks = s.p2.stocks; p2.alive = s.p2.alive;
        p2.guarding = s.p2.guarding; p2.weapon = s.p2.weapon; p2.stunTimer = s.p2.stunTimer;

        gameState.matchTimer = s.timer;
        gameState.roundNumber = s.round;
        gameState.p1RoundWins = s.p1Wins;
        gameState.p2RoundWins = s.p2Wins;

        if (s.finished && gameState.screen === 'playing') {
          gameState.winnerId = s.winnerId;
          gameState.winReason = s.winReason || 'KEMENANGAN';
          gameState.screen = 'victory';
          document.getElementById('hudLayer').classList.add('hidden');
          document.getElementById('hudLayer').classList.remove('flex');
          populateVictoryScreen();
          document.getElementById('victoryScreen').classList.remove('hidden');
          document.getElementById('victoryScreen').classList.add('flex');
        }
      },

      broadcastWorldSnapshot(dt) {
        if (gameState.netRole !== 'host' || !gameState.netConnected || !p1 || !p2) return;
        this.stateSyncTimer += dt;
        if (this.stateSyncTimer < 0.033) return; // ~30Hz snapshot sync
        this.stateSyncTimer = 0;

        this.send({
          type: 'world_snap',
          snap: {
            p1: {
              x: p1.x, y: p1.y, vx: p1.vx, vy: p1.vy, facing: p1.facing,
              hp: p1.hp, stamina: p1.stamina, mana: p1.mana, stocks: p1.stocks,
              alive: p1.alive, guarding: p1.guarding, weapon: p1.weapon, stunTimer: p1.stunTimer
            },
            p2: {
              x: p2.x, y: p2.y, vx: p2.vx, vy: p2.vy, facing: p2.facing,
              hp: p2.hp, stamina: p2.stamina, mana: p2.mana, stocks: p2.stocks,
              alive: p2.alive, guarding: p2.guarding, weapon: p2.weapon, stunTimer: p2.stunTimer
            },
            timer: gameState.matchTimer,
            round: gameState.roundNumber,
            p1Wins: gameState.p1RoundWins,
            p2Wins: gameState.p2RoundWins,
            finished: gameState.winnerId !== null,
            winnerId: gameState.winnerId,
            winReason: gameState.winReason
          }
        });
      }
    };

    function clearAllInputs() {
<!-- ... existing code ... -->
      if (!firstPress) return;

      // Online Guest mode: Guest controls P2 over the network
      if (gameState.playMode === 'online' && gameState.netRole === 'guest') {
        if (code === 'ArrowUp' || code === 'KeyW') netSync.send({ type: 'p2_action', action: 'jump' });
        if (code === 'ArrowDown' || code === 'KeyS') netSync.send({ type: 'p2_action', action: 'drop' });
        if (code === 'Slash' || code === 'KeyK' || code === 'KeyF') {
          netSync.send({ type: 'p2_action', action: 'attack' });
        }
        if (code === 'KeyL' || code === 'Period' || code === 'KeyG') {
          const dir = (keysDown.has('ArrowRight') || keysDown.has('KeyD') ? 1 : 0) -
                      (keysDown.has('ArrowLeft') || keysDown.has('KeyA') ? 1 : 0);
          netSync.send({ type: 'p2_action', action: dir === 0 ? 'special' : 'dash', dir });
        }
        if ((code === 'Semicolon' || code === 'Comma' || code === 'KeyR') && gameState.allowSwap) {
          netSync.send({ type: 'p2_action', action: 'swap' });
        }
        return;
      }

      // Player 1 discrete actions (Local / Bot / Online Host)
      if (code === 'KeyW') p1.jump();
      if (code === 'KeyS') p1.dropPlatform();
      if (code === 'KeyF') {
        p1.primaryAttack(p2);
        p1.setGuard(true);
      }
      if (code === 'KeyG') {
        const dir = (keysDown.has('KeyD') ? 1 : 0) - (keysDown.has('KeyA') ? 1 : 0);
        if (keysDown.has('ShiftLeft') || dir === 0) {
          p1.specialSkill(p2);
        } else {
          p1.dash(dir);
        }
      }
      if (code === 'KeyR' && gameState.allowSwap) {
        p1.swapWeapon();
        if (gameState.playMode === 'online' && gameState.netRole === 'host') {
          netSync.send({ type: 'loadout_update', player: 1, weapon: p1.weapon });
        }
      }

      // Player 2 discrete actions (when local 2-player)
      if (gameState.playMode === 'human' && !gameState.p2Bot) {
        if (code === 'ArrowUp') p2.jump();
        if (code === 'ArrowDown') p2.dropPlatform();
        if (code === 'Slash' || code === 'KeyK') {
          p2.primaryAttack(p1);
          p2.setGuard(true);
        }
        if (code === 'KeyL' || code === 'Period') {
          const dir = (keysDown.has('ArrowRight') ? 1 : 0) - (keysDown.has('ArrowLeft') ? 1 : 0);
          if (dir === 0) {
            p2.specialSkill(p1);
          } else {
            p2.dash(dir);
          }
        }
        if ((code === 'Semicolon' || code === 'Comma') && gameState.allowSwap) {
          p2.swapWeapon();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      const code = e.code;
      keysDown.delete(code);

      if (gameState.playMode === 'online' && gameState.netRole === 'guest') {
        netSync.send({
          type: 'p2_state',
          left: keysDown.has('ArrowLeft') || keysDown.has('KeyA'),
          right: keysDown.has('ArrowRight') || keysDown.has('KeyD'),
          guard: keysDown.has('Slash') || keysDown.has('KeyK') || keysDown.has('KeyF')
        });
        return;
      }

      if (code === 'KeyF' && p1) {
        p1.setGuard(false);
      }
      if ((code === 'Slash' || code === 'KeyK') && p2) {
        p2.setGuard(false);
      }
    });

    function applyContinuousInputs(dt) {
      if (gameState.screen !== 'playing') return;

      // Guest sends continuous P2 state to Host
      if (gameState.playMode === 'online' && gameState.netRole === 'guest') {
        netSync.send({
          type: 'p2_state',
          left: keysDown.has('ArrowLeft') || keysDown.has('KeyA'),
          right: keysDown.has('ArrowRight') || keysDown.has('KeyD'),
          guard: keysDown.has('Slash') || keysDown.has('KeyK') || keysDown.has('KeyF')
        });
        return;
      }

      // Player 1 continuous run
      if (keysDown.has('KeyA')) p1.moveLeft(dt);
      if (keysDown.has('KeyD')) p1.moveRight(dt);
      if (!keysDown.has('KeyF')) p1.setGuard(false);

      // Player 2 continuous run (Local Human / Remote Guest / AI Bot)
      if (gameState.playMode === 'online' && gameState.netRole === 'host') {
        if (gameState.remoteInput.left) p2.moveLeft(dt);
        if (gameState.remoteInput.right) p2.moveRight(dt);
        p2.setGuard(gameState.remoteInput.guard);
      } else if (!gameState.p2Bot) {
        if (keysDown.has('ArrowLeft')) p2.moveLeft(dt);
        if (keysDown.has('ArrowRight')) p2.moveRight(dt);
        if (!keysDown.has('Slash') && !keysDown.has('KeyK')) p2.setGuard(false);
      } else {
        botAI.update(dt, p2, p1);
      }
    }

    function syncStartScreenUI() {
      const humanBtn = document.getElementById('modeHumanBtn');
      const botBtn = document.getElementById('modeBotBtn');
      const onlineBtn = document.getElementById('modeOnlineBtn');
      const botDiffRow = document.getElementById('botDiffRow');
      const onlineRoomPanel = document.getElementById('onlineRoomPanel');
      const onlineRoleLabel = document.getElementById('onlineRoleLabel');
      const p2Title = document.getElementById('p2LoadoutTitle');

      const activeBtnCls = 'btn-arcade rounded-xl border px-2 py-2 text-[11px] font-bold transition bg-emerald-500/20 border-emerald-400 text-emerald-200';
      const idleBtnCls = 'btn-arcade rounded-xl border px-2 py-2 text-[11px] font-bold transition bg-slate-800/70 border-white/10 text-slate-300 hover:bg-slate-800';

      humanBtn.className = gameState.playMode === 'human' ? activeBtnCls : idleBtnCls;
      botBtn.className = gameState.playMode === 'bot' ? activeBtnCls : idleBtnCls;
      onlineBtn.className = gameState.playMode === 'online' ? 'btn-arcade rounded-xl border px-2 py-2 text-[11px] font-bold transition bg-sky-500/25 border-sky-400 text-sky-200' : idleBtnCls;

      if (gameState.playMode === 'bot') {
        botDiffRow.classList.remove('hidden');
        botDiffRow.classList.add('flex');
        onlineRoomPanel.classList.add('hidden');
        onlineRoomPanel.classList.remove('flex');
        p2Title.textContent = `PEMAIN 2 • BOT AI (${gameState.botDifficulty.toUpperCase()})`;
      } else if (gameState.playMode === 'online') {
        botDiffRow.classList.add('hidden');
        botDiffRow.classList.remove('flex');
        onlineRoomPanel.classList.remove('hidden');
        onlineRoomPanel.classList.add('flex');
        if (gameState.netRole === 'host') {
          onlineRoleLabel.textContent = 'Perangkat Ini: PEMAIN 1 (Host)';
          p2Title.textContent = 'PEMAIN 2 • PERANGKAT LAIN';
        } else if (gameState.netRole === 'guest') {
          onlineRoleLabel.textContent = 'Perangkat Ini: PEMAIN 2 (Tamu)';
